<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kişisel notlar ve yazılar." />
    <title>Oğulr — kişisel notlar</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='25'%3E✦%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav wrap" aria-label="Ana menü">
        <a class="brand" href="#timeline" aria-label="Ana sayfa">
          <span data-site-name>Oğulr</span><span class="entry-count" data-entry-count></span>
        </a>
        <div class="nav-links">
          <a class="nav-link is-active" href="#timeline" data-view-link="timeline">Timeline</a>
          <a class="nav-link" href="#dev-log" data-view-link="dev-log">Dev Log</a>
          <a class="nav-link" href="#search" data-view-link="search">Search</a>
          <a class="nav-link" href="#archive" data-view-link="archive">Archive</a>
          <button class="nav-link random-button" type="button" data-random>Random</button>
          <button class="theme-toggle" type="button" aria-label="Koyu temayı aç" title="Temayı değiştir">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 15.8A8.4 8.4 0 0 1 8.2 3.4 8.4 8.4 0 1 0 20.6 15.8Z" /></svg>
          </button>
        </div>
      </nav>
    </header>

    <main class="wrap">
      <section class="view is-visible" data-view="timeline" aria-labelledby="timeline-title">
        <h1 id="timeline-title" class="sr-only">Zaman akışı</h1>
        <div class="stream" data-post-list></div>
      </section>

      <section class="view" data-view="dev-log" aria-labelledby="dev-log-title">
        <header class="page-heading">
          <p class="eyebrow">GÜNLÜK</p>
          <h1 id="dev-log-title">Dev Log</h1>
          <p>Yapım aşamasındaki fikirler, denemeler ve küçük ilerlemeler.</p>
        </header>
        <div class="stream" data-dev-log-list></div>
      </section>

      <section class="view" data-view="search" aria-labelledby="search-title">
        <header class="page-heading">
          <p class="eyebrow">ARŞİVDE ARA</p>
          <h1 id="search-title">Search</h1>
          <label class="search-box">
            <span class="sr-only">Yazılarda ara</span>
            <input type="search" data-search-input placeholder="Bir şey yazmaya başla..." autocomplete="off" />
            <kbd>Esc</kbd>
          </label>
        </header>
        <p class="result-note" data-search-note>Aramak için yazmaya başla.</p>
        <div class="stream" data-search-list></div>
      </section>

      <section class="view" data-view="archive" aria-labelledby="archive-title">
        <header class="page-heading">
          <p class="eyebrow">TÜM YAZILAR</p>
          <h1 id="archive-title">Archive</h1>
        </header>
        <div class="archive-list" data-archive-list></div>
      </section>

      <section class="view" data-view="post" aria-live="polite">
        <a class="back-link" href="#timeline">← Zaman akışına dön</a>
        <article class="post-page" data-post-page></article>
      </section>
    </main>

    <footer class="site-footer wrap">
      <span data-site-handle>ogulguney</span><span class="footer-dot">·</span><span>GitHub Pages ile yayında</span>
    </footer>

    <template id="post-card-template">
      <article class="post-card">
        <a class="post-link" href="#" data-post-link>
          <time class="post-meta" data-post-date></time>
          <h2 data-post-title></h2>
          <p class="post-excerpt" data-post-excerpt></p>
          <span class="read-more">oku →</span>
        </a>
      </article>
    </template>

    <script src="content/site.js"></script>
    <script src="content/posts.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
